[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
# test transactions only: the statistical difficulty tests run hundreds of full draws in one test
gas_limit = 9223372036854775807
optimizer = true
optimizer_runs = 200

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
bsc_testnet = "${BSC_TESTNET_RPC_URL}"
bsc = "${BSC_RPC_URL}"
